<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <title>社团报名登记</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>校园社团报名登记</h1>
</header>

<nav>
    <p>社团报名系统</p >
</nav>

<main>
    <section>
        <h2>报名须知</h2>
        <p>请如实填写个人信息，提交后社团工作人员会进行审核。</p >

        <form action="#" method="get">
            <!-- 1.text 姓名 -->
            <div class="form-item">
                <label for="username">姓名</label>
                <input type="text" id="username" name="username" required>
            </div>

            <!--2.email 邮箱 -->
            <div class="form-item">
                <label for="email">电子邮箱</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!--3.radio 意向社团单选 -->
            <div class="form-item">
                <label>意向社团</label>
                <div>
                    <input type="radio" id="club1" name="club" value="music">
                    <label for="club1">音乐社</label>

                    <input type="radio" id="club2" name="club" value="sport">
                    <label for="club2">体育社</label>

                    <input type="radio" id="club3" name="club" value="art">
                    <label for="club3">美术社</label>
                </div>
            </div>

            <!--4.checkbox 特长多选 -->
            <div class="form-item">
                <label>个人特长</label>
                <div>
                    <input type="checkbox" id="skill1" name="skill" value="sing">
                    <label for="skill1">唱歌</label>

                    <input type="checkbox" id="skill2" name="skill" value="draw">
                    <label for="skill2">绘画</label>

                    <input type="checkbox" id="skill3" name="skill" value="run">
                    <label for="skill3">运动</label>
                </div>
            </div>

            <!--5.select 年级下拉 -->
            <div class="form-item">
                <label for="grade">所在年级</label>
                <select id="grade" name="grade" required>
                    <option value="">请选择年级</option>
                    <option value="2024">2024级</option>
                    <option value="2025">2025级</option>
                    <option value="2026">2026级</option>
                </select>
            </div>

            <!--6.textarea 个人简介 -->
            <div class="form-item">
                <label for="intro">个人简介</label>
                <textarea id="intro" name="intro" maxlength="150"></textarea>
            </div>

            <button type="submit">提交报名</button>
        </form>
    </section>
</main>

<footer>
    软件开发综合实践 · 课程作业
</footer>
</body>
</html>
